name: keystone-mvp

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: keystone-mvp-frontend:${KEYSTONE_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      # Keep the MVP behind the host Nginx; do not expose a second public HTTP port.
      - "127.0.0.1:${FRONTEND_PORT:-18081}:80"
    environment:
      APP_HOST: app
      APP_PORT: "8080"
      APP_SCHEME: http
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-20}"
    depends_on:
      app:
        condition: service_healthy
    networks: [keystone_mvp]
    mem_limit: 160m

  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.app
      args:
        GOPROXY_ARG: "${GOPROXY_ARG:-https://goproxy.cn,direct}"
        APK_MIRROR_ARG: "${APK_MIRROR_ARG:-mirrors.aliyun.com}"
    image: keystone-mvp-app:${KEYSTONE_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      GIN_MODE: release
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      RETRIEVE_DRIVER: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-keystone_embeddings}"
      STORAGE_TYPE: oss
      # The cloud MVP has one approved object store: the OSS bucket from .env.
      STORAGE_ALLOW_LIST: oss
      APP_EXTERNAL_URL: "${APP_EXTERNAL_URL}"
      KEYSTONE_MODEL_MAX_CONCURRENCY: "${KEYSTONE_MODEL_MAX_CONCURRENCY:-1}"
      KEYSTONE_ASYNQ_CORE_CONCURRENCY: "${KEYSTONE_ASYNQ_CORE_CONCURRENCY:-1}"
      KEYSTONE_ASYNQ_ENRICHMENT_CONCURRENCY: "${KEYSTONE_ASYNQ_ENRICHMENT_CONCURRENCY:-1}"
      KEYSTONE_ASYNQ_MAINTENANCE_CONCURRENCY: "${KEYSTONE_ASYNQ_MAINTENANCE_CONCURRENCY:-1}"
      KEYSTONE_ASYNQ_SHARED_CONCURRENCY: "${KEYSTONE_ASYNQ_SHARED_CONCURRENCY:-1}"
      KEYSTONE_WIKI_ASYNQ_CONCURRENCY: "${KEYSTONE_WIKI_ASYNQ_CONCURRENCY:-1}"
      # Complex document parsing stays inside the Compose network. Do not
      # publish the gRPC port on the ECS host.
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: grpc
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      docreader:
        condition: service_healthy
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - app_state:/data/files
    networks: [keystone_mvp]
    mem_limit: 1200m

  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 1m
    networks: [keystone_mvp]
    mem_limit: 1100m

  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose: ["6333", "6334"]
    networks: [keystone_mvp]
    mem_limit: 1000m

  # CPU-only document parser for PDF, Office and other complex formats.
  # Keep it private: the application is its only client.
  docreader:
    image: "wechatopenai/keystone-docreader:${KEYSTONE_DOCREADER_TAG:-latest}"
    # Build from this checked-out source when an upstream prebuilt image is not
    # available through the ECS registry mirror.
    build:
      context: ../..
      dockerfile: docker/Dockerfile.docreader
      args:
        APT_MIRROR: "${DOCREADER_APT_MIRROR:-}"
    restart: unless-stopped
    expose: ["50051"]
    environment:
      TZ: Asia/Shanghai
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-20}"
      # Conservative limits for the current 2C4G MVP host.
      DOCREADER_MARKITDOWN_MAX_WORKERS: "${DOCREADER_MARKITDOWN_MAX_WORKERS:-1}"
      DOCREADER_PDF_RENDER_MAX_WORKERS: "${DOCREADER_PDF_RENDER_MAX_WORKERS:-1}"
      DOCREADER_PDF_RENDER_PARALLELISM: "${DOCREADER_PDF_RENDER_PARALLELISM:-1}"
      DOCREADER_PDF_RENDER_DPI: "${DOCREADER_PDF_RENDER_DPI:-160}"
      DOCREADER_PDF_JPEG_QUALITY: "${DOCREADER_PDF_JPEG_QUALITY:-80}"
      DOCREADER_PDF_RENDER_MAX_EDGE: "${DOCREADER_PDF_RENDER_MAX_EDGE:-1600}"
      DOCREADER_ODL_HYBRID: "off"
      GRPC_TLS_ENABLED: "false"
    volumes:
      - docreader_tmp:/tmp/docreader
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [keystone_mvp]
    mem_limit: 750m

networks:
  keystone_mvp:
    driver: bridge

volumes:
  app_state:
  postgres_data:
  qdrant_data:
  docreader_tmp:
