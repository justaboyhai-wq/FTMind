<!DOCTYPE html>
<html lang="en">
<head>
    <title>FTMind</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="知识工作台、文档解析、语义检索、RAG、智能体、Wiki、私有部署、人工智能应用"/>
    <meta name="description" content="FTMind 是面向私有部署的知识工作台，提供文档解析、语义检索、流式对话、智能体与 Wiki 能力。"/>
    <link rel="icon" type="image/png" href="/ftmind-logo.png" />
    <link rel="apple-touch-icon" sizes="120x120" type="image/png" href="/ftmind-logo.png" />
</head>
<body>
<script>
(function(){
  function migrate(storage, legacyKey, newKey){
    var v=storage.getItem(legacyKey);
    if(v!==null&&storage.getItem(newKey)===null)storage.setItem(newKey,v);
  }
  // Very old BlexWiki keys -> FTMind keys.
  migrate(localStorage,'BlexWiki_theme','FTMind_theme');
  migrate(localStorage,'blexwiki_lite_mode','ftmind_lite_mode');
  migrate(sessionStorage,'blexwiki_lite_last_path','ftmind_lite_last_path');
  // Migrate legacy brand storage keys to FTMind keys.
  migrate(localStorage,'FMind_theme','FTMind_theme');
  migrate(localStorage,'fmind_lite_mode','ftmind_lite_mode');
  migrate(sessionStorage,'fmind_lite_last_path','ftmind_lite_last_path');
  var t=localStorage.getItem('FTMind_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('theme-mode',t);
  /* 与 theme.css 中 --td-bg-color-page 一致，避免样式加载后整页背景从 #fff 跳到 #eee 触发重绘闪动 */
  var bg=t==='dark'?'#181818':'#eee';
  document.documentElement.style.background=bg;
  document.documentElement.style.minHeight='100%';
  document.documentElement.style.colorScheme=t==='dark'?'dark':'light';
  document.body.style.background=bg;
  document.body.style.minHeight='100%';
  try{
    var w=window.runtime;
    if(w){
      if(t==='dark'){
        if(w.WindowSetDarkTheme)w.WindowSetDarkTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(24,24,24,255);
      }else{
        if(w.WindowSetLightTheme)w.WindowSetLightTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(238,238,238,255);
      }
    }
  }catch(_){}
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('ftmind_lite_mode') !== 'true') return;
    var saved = sessionStorage.getItem('ftmind_lite_last_path');
    if (!saved || saved.indexOf('/platform/') !== 0 || saved.indexOf('/platform/organizations') === 0) return;
    var path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    var target = saved.indexOf('#') >= 0 ? saved.slice(0, saved.indexOf('#')) : saved;
    if (!target) return;
    var current = window.location.pathname + window.location.search;
    if (target !== current) window.history.replaceState(window.history.state, '', target);
  } catch (e) {}
})();
</script>
<script src="/config.js"></script>
<!--
  离线部署兼容：提前本地加载 tdesign-icons SVG sprite，避免 tdesign-vue-next 的
  <t-icon> 运行时向 https://tdesign.gtimg.com 发起请求（见 issue #867 / #897）。
  升级 tdesign-icons-vue-next 时需同步更新 public/tdesign-icons/<version>/fonts/index.js。
-->
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="app"></div>
<script>
(function(){
  var t=localStorage.getItem('FTMind_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  var bg=t==='dark'?'#181818':'#eee';
  var el=document.getElementById('app');
  if(el){ el.style.background=bg; el.style.minHeight='100%'; }
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
